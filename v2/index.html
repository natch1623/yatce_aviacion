<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>Práctica profesional · Vuelo 3D</title>
<!--
  Presentación 3D de la práctica profesional. Un solo archivo, funciona sin internet.
  CONTROLES: → espacio o clic avanza · ← retrocede · Inicio/Fin · F pantalla completa · P pausa
  Añade #5 al final de la dirección para abrir directamente en la slide 5.
  Añade ?calidad=baja si el equipo va lento.
  El código fuente editable está en v2/fuente/src (npm install y luego npm run build).
-->
<style>:root {
  --ink: #ffffff;
  --muted: rgba(255, 255, 255, 0.78);
  --accent: #f2b544;
  --hud: #8dffc0;
  --font: "Bahnschrift", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #05070b; color: var(--ink); font-family: var(--font); }
#gl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; transition: filter 0.08s linear; }
#rain {
  position: fixed; inset: -20% 0 0 0; pointer-events: none; opacity: 0;
  background-image:
    repeating-linear-gradient(103deg, rgba(220,230,255,0) 0 22px, rgba(220,230,255,0.22) 22px 23px, rgba(220,230,255,0) 23px 61px),
    repeating-linear-gradient(98deg, rgba(220,230,255,0) 0 37px, rgba(220,230,255,0.14) 37px 38px, rgba(220,230,255,0) 38px 97px);
  background-size: 100% 160px, 100% 230px;
  animation: rainfall 0.35s linear infinite;
}
@keyframes rainfall { to { background-position: 0 160px, 0 230px; } }
#veil { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: #fff; }
#scrim { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1.2s ease, background 0.6s ease; }
#ui { position: fixed; inset: 0; pointer-events: none; }

#topbar {
  position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 24px;
  padding: 22px 4.2vw; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--muted); text-shadow: 0 1px 8px rgba(0, 0, 0, 0.45);
}
#topbar .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); font-weight: 600; }
#topbar svg { width: 18px; height: 18px; transform: rotate(90deg); color: var(--accent); }
#act { margin-left: auto; }
#counter { font-variant-numeric: tabular-nums; color: var(--ink); min-width: 70px; text-align: right; }

#slide {
  position: absolute; max-width: min(44vw, 820px);
  text-shadow: 0 2px 24px rgba(0, 0, 0, 0.35), 0 1px 3px rgba(0, 0, 0, 0.35);
}
#slide.pos-left { left: 6.5vw; top: 50%; transform: translateY(-50%); }
#slide.pos-right { right: 6.5vw; top: 50%; transform: translateY(-50%); text-align: right; }
#slide.pos-top { left: 50%; top: 13vh; transform: translateX(-50%); text-align: center; max-width: 72vw; }
#slide.pos-hud { left: 50%; top: 47vh; transform: translateX(-50%); text-align: center; max-width: 60vw; color: var(--hud); text-shadow: 0 0 12px rgba(120, 255, 180, 0.55); }
#slide.pos-hud #kicker { color: var(--hud); }
#slide.pos-hud #kicker::before { background: var(--hud); }
#slide.pos-hud h1 { font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; font-stretch: condensed; }

#kicker {
  display: inline-flex; align-items: center; gap: 14px; font-size: clamp(12px, 1.05vw, 17px);
  letter-spacing: 0.32em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: 1.6vh;
  opacity: 0; transform: translateY(8px); transition: opacity 0.7s ease, transform 0.7s cubic-bezier(.2, .8, .2, 1);
}
#kicker::before { content: ""; width: 0; height: 2px; background: var(--accent); transition: width 0.9s cubic-bezier(.2, .8, .2, 1) 0.1s; }
.pos-right #kicker { flex-direction: row-reverse; }
#slide.in #kicker { opacity: 1; transform: none; }
#slide.in #kicker::before { width: 46px; }

#title {
  font-size: clamp(40px, 5.6vw, 112px); line-height: 1.02; font-weight: 700; letter-spacing: -0.012em;
}
#title.long { font-size: clamp(34px, 4.1vw, 80px); }
#title.xlong { font-size: clamp(30px, 3.4vw, 64px); line-height: 1.08; }
#title .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 0.08em; margin-bottom: -0.08em; }
#title .w > span { display: inline-block; transform: translateY(105%); transition: transform 1s cubic-bezier(.16, .84, .24, 1); }
#slide.in #title .w > span { transform: none; }
#subtitle {
  margin-top: 2vh; font-size: clamp(16px, 1.55vw, 28px); color: var(--muted); font-weight: 400; letter-spacing: 0.01em;
  opacity: 0; transform: translateY(10px); transition: opacity 0.9s ease 0.5s, transform 0.9s cubic-bezier(.2, .8, .2, 1) 0.5s;
}
#slide.in #subtitle { opacity: 1; transform: none; }
#slide.out { opacity: 0; filter: blur(6px); transition: opacity 0.45s ease, filter 0.45s ease; }

#route { position: absolute; left: 4.2vw; right: 4.2vw; bottom: 26px; height: 22px; }
#route .track { position: absolute; left: 0; right: 0; top: 10px; height: 1px; background: rgba(255, 255, 255, 0.28); }
#route .fill { height: 100%; width: 0; background: var(--accent); transition: width 1.4s cubic-bezier(.4, 0, .2, 1); }
#route .ticks { position: absolute; inset: 0; }
#route .tick { position: absolute; top: 7px; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: rgba(255, 255, 255, 0.35); transition: background 0.6s; }
#route .tick.done { background: var(--accent); }
#route .planeicon { position: absolute; top: 0; width: 22px; height: 22px; margin-left: -11px; color: #fff; transition: left 1.4s cubic-bezier(.4, 0, .2, 1); filter: drop-shadow(0 0 6px rgba(0, 0, 0, 0.5)); }
#route .planeicon svg { width: 100%; height: 100%; transform: rotate(90deg); }

#cockpit { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
#cockpit svg { width: 100%; height: 100%; display: block; }
#cockpit .hudtxt { font-family: var(--font); fill: var(--hud); font-size: 15px; letter-spacing: 0.06em; }

#start {
  position: fixed; inset: 0; display: grid; place-items: center; z-index: 10;
  background: radial-gradient(120% 90% at 50% 40%, #142235 0%, #070b12 70%);
  transition: opacity 1.2s ease, visibility 1.2s;
}
#start.gone { opacity: 0; visibility: hidden; }
.pass { display: flex; width: min(860px, 92vw); border-radius: 18px; overflow: hidden; background: #f5f1e8; color: #13243f; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55); }
.pass-main { flex: 1; padding: 38px 42px; }
.pass-kicker { font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; color: #9a6a12; font-weight: 600; }
.pass h1 { font-size: clamp(30px, 4vw, 48px); margin-top: 10px; line-height: 1.05; }
.pass-sub { margin-top: 6px; color: #4c5a6e; font-size: 17px; }
.pass-grid { display: grid; grid-template-columns: repeat(4, auto); gap: 18px 26px; margin-top: 28px; }
.pass-grid span { display: block; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #7b8698; }
.pass-grid b { font-size: 19px; letter-spacing: 0.04em; }
.pass-stub { width: 240px; padding: 34px 26px; border-left: 2px dashed #c9bfa9; display: flex; flex-direction: column; justify-content: center; gap: 16px; background: #ece5d6; }
#start-status { font-size: 14px; color: #4c5a6e; }
#start-btn {
  pointer-events: auto; cursor: pointer; border: 0; border-radius: 999px; padding: 14px 22px; font: 600 16px var(--font);
  letter-spacing: 0.12em; text-transform: uppercase; background: #13243f; color: #fff; transition: transform 0.2s, background 0.2s;
}
#start-btn:hover { background: #1d3863; transform: translateY(-1px); }
#start-btn:focus-visible { outline: 3px solid #f2b544; outline-offset: 3px; }
.hint { font-size: 11px; color: #7b8698; letter-spacing: 0.06em; }

@media (max-width: 700px) {
  .pass { flex-direction: column; }
  .pass-stub { width: auto; border-left: 0; border-top: 2px dashed #c9bfa9; }
  .pass-grid { grid-template-columns: repeat(2, auto); }
  #slide, #slide.pos-top, #slide.pos-hud { max-width: 86vw; }
  #act { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  #title .w > span, #kicker, #subtitle { transition-duration: 0.01s !important; }
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="rain"></div>
<div id="veil"></div>
<div id="cockpit" aria-hidden="true"></div>
<div id="scrim"></div>
<main id="ui">
  <header id="topbar">
    <span class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z" fill="currentColor"/></svg>Práctica profesional</span>
    <span id="act"></span>
    <span id="counter"></span>
  </header>
  <section id="slide" aria-live="polite">
    <p id="kicker"></p>
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </section>
  <nav id="route" aria-label="Progreso de la presentación">
    <div class="track"><div class="fill"></div></div>
    <div class="ticks"></div>
    <div class="planeicon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z" fill="currentColor"/></svg></div>
  </nav>
</main>
<div id="start">
  <div class="pass">
    <div class="pass-main">
      <p class="pass-kicker">Tarjeta de embarque · Vuelo AR 2026</p>
      <h1>Práctica profesional</h1>
      <p class="pass-sub">Un recorrido de aprendizaje</p>
      <div class="pass-grid">
        <div><span>Origen</span><b>AULA</b></div>
        <div><span>Destino</span><b>EXPERIENCIA</b></div>
        <div><span>Puerta</span><b>07</b></div>
        <div><span>Asiento</span><b>1A</b></div>
      </div>
    </div>
    <div class="pass-stub">
      <p id="start-status">Preparando el vuelo…</p>
      <button id="start-btn" hidden>Abordar</button>
      <p class="hint">← → avanzar · F pantalla completa · P pausar</p>
    </div>
  </div>
</div>
