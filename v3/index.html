:root { --desk: #1b1a18; --ink: #1c2944; --paper: #f4ecdb; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #2a2824, var(--desk) 75%); color: var(--paper); font-family: Inter, system-ui, sans-serif; }
#stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 4px 0 #d9cfb9, 0 7px 0 #c9bea6; border-radius: 3px; }
#page { display: block; width: 100%; height: 100%; cursor: pointer; border-radius: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#dock { position: fixed; right: 18px; bottom: 16px; display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 30px; background: rgba(28,41,68,.82); backdrop-filter: blur(6px); transition: opacity .4s; z-index: 5; }
body.idle #dock { opacity: 0; }
#dock button { display: grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 50%; background: transparent; color: var(--paper); cursor: pointer; }
#dock button:hover:not(:disabled) { background: rgba(244,236,219,.14); }
#dock button:disabled { opacity: .3; cursor: default; }
#dock button:focus-visible { outline: 2px solid #f6d58a; outline-offset: 2px; }
#dock button[aria-pressed="true"] { background: rgba(200,71,63,.6); }
#dock svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#count { min-width: 64px; text-align: center; font-size: 14px; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; font: italic 500 34px "Cormorant Garamond", Georgia, serif; color: var(--paper); background: var(--desk); transition: opacity .5s; z-index: 9; }
body.ready #loading { opacity: 0; pointer-events: none; }
@media (max-width: 700px) { #dock { right: 50%; transform: translateX(50%); bottom: 10px; } }
</style>
</head>

</nav>

<script>'use strict';
{

// ============================================================
// hand-drawn canvas core
// Everything a film needs except the film itself: palettes and colour
// maths, four surface finishes (ink, riso, screen, pencil), the marks,
// lattices, reveals, photos with doodles on them, camera, timeline, score
// plumbing and the player.
//
// A film is an HTML file that loads this script, then defines drawings,
// scenes and a timeline and calls defineFilm({...}). See examples/sketchbook-bird.html.
//
// Sections: CONFIG · COLOUR · PALETTES · RANDOM, EASING & MOTION · GEOMETRY ·
// MARKS · FINISHES · LATTICES & PARTICLES · MOTIFS · REVEALS & COMPOSITION ·
// PHOTOS & DOODLES · STYLE SHEETS · TIMELINE & RUNTIME
// ============================================================

// ===================== CONFIG =====================
// Logical frame: the short side is always 1080 units, the long side follows the aspect ratio.
// Scenes draw in logical units. S scales them to the output width chosen at render time.
const SHORT = 1080;
let W = 1080, H = 1080, S = 1, CX = 540, CY = 540, OUT_W = 1080, OUT_H = 1080;
const _layers = [];   // weak registrations: live layers resize; transient print plates can be collected
function setFormat({ ar = '1:1', width } = {}) {
  const [a, b] = String(ar).split(/[:x\/]/).map(Number); const r = (a > 0 && b > 0) ? a / b : 1;
  if (r >= 1) { H = SHORT; W = Math.round(SHORT * r); } else { W = SHORT; H = Math.round(SHORT / r); }
  S = width ? width / W : 1; OUT_H = 2 * Math.round(H * S / 2); S = OUT_H / H; OUT_W = 2 * Math.round(W * S / 2);
  CX = W / 2; CY = H / 2;
  for (let i = _layers.length - 1; i >= 0; i--) { const L = _layers[i], o = L.ref.deref(); if (!o) { _layers.splice(i, 1); continue; } o.width = Math.round((L.w ?? W) * S); o.height = Math.round((L.h ?? H) * S); }   // layers made at file scope follow the format
  return { W, H, S, OUT_W, OUT_H };
}
{ const q = new URLSearchParams(location.search); if (q.has('ar') || q.has('w')) setFormat({ ar: q.get('ar') || '1:1', width: +q.get('w') || undefined }); }
let FPS_DRAW = 24; const FPS_OUT = 24;      // drawn frames per second (12 = everything on twos; defineFilm({ fps: 24 }) puts the camera on ones), packed to 24 fps
const TAU = Math.PI * 2;
const HAND_FONT = '"Bradley Hand", "Segoe Script", "Chalkboard", "Comic Sans MS", cursive';

// ===================== COLOUR =====================
// All helpers take and return CSS colours. Hex in, hex out, except alpha().
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
function parseColor(c) {

}
const toHex = ([r, g, b]) => '#' + [r, g, b].map(v => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
function mix(a, b, t) { const A = parseColor(a), B = parseColor(b); return toHex(A.map((v, i) => lerp(v, B[i], t))); }

const shade = (c, t) => mix(c, '#000000', t);      // towards black
function alpha(c, a) { const [r, g, b] = parseColor(c); return `rgba(${r},${g},${b},${a})`; }
function rgbToHsl([r, g, b]) { r /= 255; g /= 255; b /= 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2; if (mx === mn) return [0, 0, l];

const withHsl = (c, fn) => toHex(hslToRgb(fn(hsl(c))));
const rotateHue = (c, deg) => withHsl(c, ([h, s, l]) => [h + deg, s, l]);

const lighten = (c, d) => withHsl(c, ([h, s, l]) => [h, s, clamp(l + d, 0, 1)]);

// ===================== PALETTES =====================
// Every palette has the same keys, so a scene written for one runs on any other.
//   paper      background of daylight shots        night     background of dark / blueprint shots
//   paperBand  faint light bands on paper (or null) chalk     light line on night, chalkDim its quiet version

//   fills[]    3..6 flat fills for subjects        shade     hatch / dot colour laid over fills

//   accents[]  4 loud colours for scribble outlines, wakes, sparks

//   finish     default surface finish: 'ink' | 'riso' | 'screen' | 'pencil' | 'flat'
const PALETTES = {

  s.pencil([[x0, bottom], [x1, bottom]]);
  s.ink(roof, { w: 3 });
  s.shape([[x0, top + 12], [x1, top + 6], [x1, bottom], [x0, bottom]], { w: 2.4, corner: .5 });
  const step = o.step ?? 52;
  for (let x = x0 + step; x < x1 - 10; x += step) s.ink([[x, top + 14], [x + 1, bottom]], { w: 1, p: .2, alpha: .8, speed: 6000 });
  s.ink([[x0, (top + bottom) / 2 + 4], [x1, (top + bottom) / 2]], { w: 1, p: .2 });
  s.wash([[x0, top + 12], [x1, top + 6], [x1, bottom], [x0, bottom]], o.glass ?? SKY, { opacity: .38, warp: 3 });
  s.hatch([[x0, top + 12], [x1, top + 6], [x1, top + 34], [x0, top + 40]], { angle: .5, gap: 8, alpha: .3 });
  if (o.label) s.text(o.label, x0 + 18, top + 2, { font: `600 20px ${SANS}`, spacing: 4, size: 20 });
}

function ground(s, x0, x1, y, o = {}) {
  s.ink([[x0, y], [x1, y + 2]], { w: 2.6 });
  s.hatch([[x0, y + 4], [x1, y + 6], [x1, y + (o.depth ?? 40)], [x0, y + (o.depth ?? 40)]], { angle: .2, gap: 9, len: 22, alpha: .25 });
}

function suitcase(s, x, y, w, h, color = RED) {
  const body = R(x, y, w, h);
  s.shape(body, { w: 2.2, corner: .5 });
  s.ink([[x + w * .32, y], [x + w * .32, y - h * .22], [x + w * .68, y - h * .22], [x + w * .68, y]], { w: 2, corner: .5 });
  s.ink([[x + w * .25, y + 3], [x + w * .25, y + h - 3]], { w: 1, p: .2 }); s.ink([[x + w * .75, y + 3], [x + w * .75, y + h - 3]], { w: 1, p: .2 });
  s.wash(body, color, { opacity: .55, warp: 2 });
}

function stanchion(s, x, y, h = 120) {
  s.ink([[x, y], [x, y - h]], { w: 3 });
  s.shape(ellPts(x, y + 2, 26, 7, 0, 18), { w: 2 });
  s.shape(ellPts(x, y - h - 6, 7, 7, 0, 12), { w: 2 });
  s.wash(ellPts(x, y - h - 6, 7, 7, 0, 12), GOLD, { opacity: .8, warp: 0, edge: 0 });
}
function rope(s, xa, ya, xb, yb, sag = 30, color = RED) {
  const pts = Array.from({ length: 9 }, (_, i) => { const u = i / 8; return [lerp(xa, xb, u), lerp(ya, yb, u) + Math.sin(u * Math.PI) * sag]; });
  s.ink(pts, { w: 4.5, color, p: .3 });
}

function polaroid(s, x, y, w, a, o = {}) {
  const h = w * 1.18, pts = rot(R(x - w / 2, y - h / 2, w, h), x, y, a), inner = rot(R(x - w / 2 + 16, y - h / 2 + 16, w - 32, w - 32), x, y, a);
  s.wash(pts.map(([px, py]) => [px + 10, py + 12]), '#8a8f9c', { opacity: .25, warp: 2, edge: 0 });
  s.shape(pts, { w: 2.2, corner: .5 });
  s.fn(bounds(pts, 0), c => { c.fillStyle = '#fbf7ee'; c.fill(polyPath(pts)); }, { dur: .1, adv: 0 });
  s.shape(inner, { w: 1.6, corner: .5 });
  if (o.img) {
    const img = o.img; s.fn(bounds(inner), c => {
      c.save(); c.clip(polyPath(inner)); c.translate(x, y); c.rotate(a);
      const iw = w - 32, k = Math.max(iw / img.width, iw / img.height); c.drawImage(img, -img.width * k / 2, -h / 2 + 16 + iw / 2 - img.height * k / 2, img.width * k, img.height * k); c.restore();
    }, { dur: .6 });
  } else {
    s.hatch(inner, { angle: .9 + a, gap: 9, len: 18, alpha: .28 });
    s.wash(inner, o.tint ?? SKY, { opacity: .3, warp: 3, edge: .2 });
  }
  const cap = rot([[x, y + h / 2 - 26]], x, y, a)[0];
  s.text(o.caption ?? 'Foto pendiente', cap[0], cap[1], { size: 24, align: 'center', color: GRAPHITE });
  const tape = rot(R(x - 46, y - h / 2 - 16, 92, 32), x, y - h / 2, a + .08);
  s.wash(tape, '#e9d9a8', { opacity: .7, warp: 1, edge: .1 });
}

function bubble(s, x, y, w, h, tail = -1, o = {}) {
  const pts = []; for (let i = 0; i <= 36; i++) { const a = i / 36 * TAU; pts.push([x + Math.cos(a) * w / 2, y + Math.sin(a) * h / 2]); }
  s.shape(pts, { w: 2.2 });
  s.ink([[x + tail * w * .18, y + h / 2 - 4], [x + tail * w * .36, y + h / 2 + 34], [x + tail * w * .02, y + h / 2 - 2]], { w: 2.2, corner: .4 });
  s.wash(pts, o.tint ?? '#fff6dc', { opacity: .6, warp: 2 });
  if (o.text) s.text(o.text, x, y + 11, { size: o.size ?? 30, align: 'center' });
}

function mountains(s, x0, x1, y, peaks, o = {}) {
  const pts = [[x0, y]]; for (const [px, py] of peaks) pts.push([px, py]); pts.push([x1, y]);
  s.ink(pts, { w: 2.6, corner: .4 });
  s.wash(pts, o.tint ?? '#8c9bb2', { opacity: o.opacity ?? .45, warp: 3 });
  for (let i = 1; i < pts.length - 1; i++) { const [px, py] = pts[i]; s.hatch([[px, py], [px + 70, y], [px, y]], { angle: 1.1, gap: 6, alpha: .3 }); }
}

function lightning(s, x, y, sc = 1) {
  const pts = T([[0, 0], [-30, 70], [6, 66], [-26, 150], [44, 50], [8, 54], [30, 0]], x, y, sc);
  s.shape(pts, { w: 2.2, corner: .3 });
  s.wash(pts, '#f2c94c', { opacity: .9, warp: 0, edge: .2 });
}

function checkmark(s, x, y, sc = 1, color = RED) { s.ink(T([[-14, 2], [-2, 16], [22, -18]], x, y, sc), { w: 4, color, corner: .4, p: .7, speed: 900 }); }
function star(s, x, y, r, color = GOLD) {
  const pts = Array.from({ length: 10 }, (_, i) => { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; return [x + Math.cos(a) * rr, y + Math.sin(a) * rr]; });
  s.shape(pts, { w: 1.8, corner: .3 }); s.wash(pts, color, { opacity: .8, warp: 0, edge: .2 });
}
function compassRose(s, x, y, r, o = {}) {
  s.shape(ellPts(x, y, r, r, 0, 48), { w: 2.4 });
  s.shape(ellPts(x, y, r * .86, r * .86, 0, 44), { w: 1.2, p: .2 });
  s.fn([x - r - 4, y - r - 4, r * 2 + 8, r * 2 + 8], c => {
    c.strokeStyle = PAL.ink; c.lineCap = 'round';
    for (let i = 0; i < 72; i++) { const a = i / 72 * TAU, l = i % 18 === 0 ? .16 : i % 2 ? .05 : .09; c.lineWidth = i % 18 === 0 ? 2 : 1; c.beginPath(); c.moveTo(x + Math.cos(a) * r * .86, y + Math.sin(a) * r * .86); c.lineTo(x + Math.cos(a) * r * (.86 - l), y + Math.sin(a) * r * (.86 - l)); c.stroke(); }
  }, { dur: .5, reveal: 'fade' });
  const pts = []; for (let i = 0; i < 16; i++) { const a = -Math.PI / 2 + i * Math.PI / 8, rr = i % 4 === 0 ? r * .66 : i % 2 ? r * .14 : r * .38; pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]); }
  s.shape(pts, { w: 2, corner: .3 });
  for (let i = 0; i < 4; i++) { const a = -Math.PI / 2 + i * Math.PI / 2; s.wash([[x, y], [x + Math.cos(a) * r * .66, y + Math.sin(a) * r * .66], [x + Math.cos(a + .39) * r * .14, y + Math.sin(a + .39) * r * .14]], o.color ?? RED, { opacity: .7, warp: 0, edge: 0 }); }
  if (o.letters !== false) [['N', 0], ['E', 1], ['S', 2], ['O', 3]].forEach(([l, i]) => { const a = -Math.PI / 2 + i * Math.PI / 2; s.text(l, x + Math.cos(a) * r * 1.16, y + Math.sin(a) * r * 1.16 + r * .06, { font: `500 ${Math.round(r * .17)}px ${SERIF}`, size: r * .17, align: 'center', dur: .15 }); });
}

;
// Láminas: encabezado, título, ruta del pie y la ilustración de cada slide.
// ART[nombre] = { build(s, slide), anim?(c, t) }. anim recibe el tiempo continuo
// desde que empezó la lámina; los objetos que se mueven lo hacen en dos (12 dpm).

const MARGIN = 130, RIGHT = 1790;
const TEXT_AREA = {
  cover: { x: MARGIN, y: 330, w: 860, size: 150 },
  left: { x: MARGIN, y: 300, w: 700, size: 104 },
  right: { x: 1110, y: 300, w: 680, size: 104 },
  top: { x: MARGIN, y: 248, w: 1660, size: 92 },
};
const q12 = t => Math.floor(t * 12) / 12;           // movimiento en dos
const boilSeed = (t, n = 3, hold = 3) => 1 + (Math.floor(t * 12 / hold) % n);   // boil: n dibujos, cada `hold` dibujos

function pageFrame(s, i, slide) {
  const n = SLIDES.length;
  s.text('Bitácora de vuelo · Práctica profesional', MARGIN, 96, { font: `500 19px ${SANS}`, size: 19, color: GRAPHITE, spacing: 1.5, dur: .3, adv: .2 });
  const right = `${ACTS[slide.act]}   ·   ${String(i + 1).padStart(2, '0')} / ${n}`;
  s.text(right, RIGHT, 96, { font: `500 19px ${SANS}`, size: 19, color: GRAPHITE, align: 'right', spacing: 1.5, dur: .3, adv: .2 });
  s.at(.05).pencil([[MARGIN, 122], [RIGHT, 123]], { adv: 0 });
  // Ruta del pie: el tramo recorrido en tinta, el resto a lápiz.
  const y = 1012, X = k => MARGIN + (RIGHT - MARGIN) * k / (n - 1), here = X(i);
  s.at(.1).pencil([[MARGIN, y], [RIGHT, y]], { adv: 0 });
  if (i > 0) s.ink([[MARGIN, y], [here, y]], { w: 2, p: .3, adv: 0 });
  const dots = []; for (let k = 0; k < n; k++) if (k !== i) dots.push([X(k), y, k < i ? 4.5 : 3]);
  s.dots(dots, { color: PAL.ink, alpha: .8, adv: 0, dur: .3 });
  for (const a of [2, 3, 4]) { const k = SLIDES.findIndex(sl => sl.act === a); s.pencil([[X(k) - 16, y - 14], [X(k) - 16, y + 14]], { adv: 0 }); }
  planeIcon(s, here, y, .62, Math.PI / 2, { w: 1.4 });
}

function pageTitle(s, slide) {
  const A = TEXT_AREA[slide.pos], font = `500 ${A.size}px ${SERIF}`, lines = wrapLines(slide.title, font, A.w);
  let y = A.y;
  if (slide.kicker) { s.text(slide.kicker.toUpperCase(), A.x + 4, y - A.size * .95, { font: `500 21px ${SANS}`, size: 21, color: RED, spacing: 5, dur: .25 }); }
  for (const l of lines) { s.text(l, A.x, y, { font, size: A.size, dur: clamp(l.length * .045, .35, 1), adv: .85 }); y += A.size * 1.02; }
  const last = measure(lines[lines.length - 1], font).width, uy = y - A.size * .78;
  s.ink(warp([[A.x, uy], [A.x + Math.min(last, A.w) * .55, uy + 4], [A.x + Math.min(last, A.w) * .9, uy - 2]], 7, 2, false), { w: 3.2, color: RED, p: .9, speed: 1600 });
  if (slide.subtitle) {
    const sf = `italic 500 ${slide.pos === 'cover' ? 44 : 36}px ${SERIF}`;
    let sy = uy + 64; for (const l of wrapLines(slide.subtitle, sf, A.w)) { s.text(l, A.x, sy, { font: sf, size: 40, color: PAL.shade, dur: .6 }); sy += 46; }
  }
  return y;
}

// Fondo de acuarela. Interiores (soft) llevan una mancha más leve para no ensuciar los objetos.
function skyWash(s, slide, cx, cy, rx, ry, soft = false) {
  const [a, b] = WASH[slide.wash], k = soft ? .55 : slide.wash === 'night' ? .9 : .8;
  s.wash(blob(cx, cy, rx, ry, 11, { amp: .14 }), b, { opacity: .5 * k, warp: 0, gran: .3, edge: .5, dur: .7 });
  s.wash(blob(cx + rx * .12, cy - ry * .1, rx * .7, ry * .62, 23, { amp: .18 }), a, { opacity: .42 * k, warp: 0, gran: .35, edge: .6, dur: .7 });
}

const ART = {};

    terminal(s, 900, 1800, 640, 800, { label: 'SALIDAS', glass: '#cfe3ef' });
    tower(s, 1720, 640, 250);

    s.dashed([[880, 975], [1820, 965]], { color: GOLD, w: 3 });
    s.shape([[1010, 772], [1140, 808], [1140, 858], [1010, 822]], { w: 2.3, corner: .5 });

};

    s.ink([[150, 1000], [528, 642]], { w: 2.8 }); s.ink([[980, 1000], [596, 642]], { w: 2.8 });

    s.hatch([[120, 650], [520, 650], [140, 1000], [120, 1000]], { angle: .1, gap: 10, color: GREEN, alpha: .5 });

    const u = (q12(t) % 7) / 6; if (u > 1) return;

};

    stamp(c, 'paperplane', [-80, -40, 160, 80], s => { const p = [[70, 0], [-60, -30], [-30, 0], [-60, 30]]; s.shape(p, { w: 2.2, corner: .3 }); s.wash(p, '#fffaf0', { opacity: .9 }); s.ink([[70, 0], [-30, 0]], { w: 1.4 }); }, x, y, { rot: Math.atan2(dy, dx) });
  },
};

// 18 y 19 · Registro fotográfico.
ART.photos3 = {
  build(s, sl) {
    skyWash(s, sl, 1350, 580, 500, 400, true);
    [[1110, 470, -.08], [1530, 430, .06], [1330, 760, -.02]].forEach(([x, y, a], k) => polaroid(s, x, y, 320, a, { img: PHOTO_IMG(sl, k), caption: CAP(sl, k) }));
  },
};
ART.photos4 = {
  build(s, sl) {
    skyWash(s, sl, 960, 680, 880, 300, true);
    [[360, 690, -.06], [770, 670, .04], [1170, 700, -.03], [1570, 680, .07]].forEach(([x, y, a], k) => polaroid(s, x, y, 300, a, { img: PHOTO_IMG(sl, k), caption: CAP(sl, k) }));
  },
};
const PHOTO_CACHE = new Map();
function PHOTO_IMG(sl, k) { const src = sl.photos?.[k]; if (!src) return null; const img = PHOTO_CACHE.get(src); return img?.complete && img.naturalWidth ? img : null; }
function CAP(sl, k) { return sl.captions?.[k] ?? (sl.photos?.[k] ? '' : 'Foto pendiente'); }
function preloadPhotos() {
  const all = SLIDES.flatMap(sl => sl.photos ?? []).filter(Boolean);
  return Promise.all(all.map(src => new Promise(res => { const img = new Image(); img.onload = img.onerror = res; img.src = src; PHOTO_CACHE.set(src, img); })));
}

// 20 · Gracias: llegada a la puerta, con la portada como espejo.
ART.arrival = {
  build(s, sl) {
    skyWash(s, sl, 1380, 520, 560, 380);
    sun(s, 1300, 440, 80, { color: '#ee9a62' });
    s.dots(Array.from({ length: 18 }, (_, k) => [960 + hash(k, 8) * 840, 180 + hash(k, 9) * 220, 1.4 + hash(k, 2) * 1.8]), { color: PAL.ink, alpha: .7 });
    terminal(s, 900, 1800, 640, 800, { label: 'LLEGADAS', glass: '#f2d48a' });
    tower(s, 980, 640, 230);
    ground(s, 860, 1830, 930);
    s.dashed([[880, 975], [1820, 965]], { color: GOLD, w: 3 });
  },
  anim(c, t) {
    // Rodaje hasta la puerta: anticipación del freno y asentamiento sobre el tren.
    const u = clamp(q12(t) / 4.2, 0, 1), x = lerp(2300, 1430, easeOutQuint(u)), dip = u >= 1 ? settle(t - 4.2, 0, { amp: 4, freq: 1.4, decay: 3 }) : 0;
    stamp(c, 'plane', PLANE_BOX, s => airliner(s, 0, 0, 1, { guides: false, dir: -1, gear: true }), x, 840 + dip, { scale: .95, rot: -dip * .002, seed: 4 });
    if (u >= 1 && Math.floor(t * 12) % 14 < 3) beacon(c, 1470, 796, RED);
  },
};

;
// Reproductor: lámina activa, paso de página sobre la espiral y controles.
// Dibuja a 24 fps; las láminas terminadas quedan horneadas y solo se repintan
// sus elementos animados.

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const REVEAL_MAX = 4.6, FLIP = .75;
const pageCv = document.getElementById('page'), pageCtx = pageCv.getContext('2d');
const stage = document.getElementById('stage');
let paperL = null, snap = null, buf = null;
let curSlide = 0, flip = null, paused = false, clock = 0, last = performance.now();
const pages = new Map();

function makeCanvas() { const c = document.createElement('canvas'); c.width = OUT_W; c.height = OUT_H; return c; }
function blitC(c, src) { c.save(); resetT(c); c.drawImage(src, 0, 0, W, H); c.restore(); }

function paperLayer() {
  const L = makeCanvas(), c = L.getContext('2d');
  paper(c, PAL.paper, null, 5);
  resetT(c);
  grain(c, rectPath(0, 0, W, H), [0, 0, W, H], 2600, '#8a7a5a', .05, 9, 1.3);
  const g = c.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.05); g.addColorStop(0, 'rgba(120,90,50,0)'); g.addColorStop(1, 'rgba(120,90,50,.16)');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  // Espiral del cuaderno: agujeros y alambre.
  for (let x = 70; x < W - 40; x += 58) {
    c.fillStyle = '#2a2722'; c.beginPath(); c.ellipse(x, 30, 9, 7, 0, 0, TAU); c.fill();
    c.strokeStyle = '#7d8088'; c.lineWidth = 4; c.lineCap = 'round'; c.beginPath(); c.moveTo(x - 4, 30); c.bezierCurveTo(x - 8, 6, x + 10, -6, x + 12, 4); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(x - 3, 24); c.bezierCurveTo(x - 5, 8, x + 6, -2, x + 9, 3); c.stroke();
  }
  return L;
}

function page(i) {
  let p = pages.get(i);
  if (!p) {
    const sl = SLIDES[i], s = new Sheet(i + 1);
    pageFrame(s, i, sl);
    s.at(.2); pageTitle(s, sl);
    s.at(.55); ART[sl.art].build(s, sl);
    s.fit(REVEAL_MAX, .5);
    p = { i, sheet: s, art: ART[sl.art], end: s.end(), bake: null, baked: null, start: 0, done: false };
    pages.set(i, p);
  }
  if (!p.bake) { p.bake = makeCanvas(); p.baked = new Uint8Array(p.sheet.marks.length); p.left = p.sheet.marks.length; }
  return p;
}
function evictPages() {
  const keep = new Set([curSlide, curSlide - 1, curSlide + 1]);
  for (const [i, p] of pages) if (!keep.has(i) && p.bake) { p.bake = null; }
}

// Hornea las marcas terminadas y devuelve las que aún se están dibujando.
function advance(p, T) {
  const active = [], g = p.bake.getContext('2d'); resetT(g);
  const ms = p.sheet.marks;
  for (let k = 0; k < ms.length; k++) {
    if (p.baked[k]) continue;
    const m = ms[k], u = (T - m.t0) / m.dur;
    if (u >= 1) { drawMark(g, m, 1); p.baked[k] = 1; p.left--; }
    else if (u > 0) active.push([m, u]);
  }
  if (!p.left) p.done = true;
  return active;
}
function compose(c, p) {
  const active = p.left ? advance(p, p.done ? Infinity : clock - p.start) : [];
  blitC(c, paperL); blitC(c, p.bake); resetT(c);
  for (const [m, u] of active) drawMark(c, m, u);
  // Lo animado entra cuando la lámina ya está dibujada.
  const t = clock - p.start;
  if (p.art.anim && (p.done || t > p.end)) { resetT(c); c.save(); p.art.anim(c, REDUCED ? 6 : t - p.end); c.restore(); }
}

function drawFlip(c, src, k, dir) {
  // La hoja gira sobre la espiral: su altura proyectada es cos(θ).
  const h = H * k; resetT(c);
  c.save(); const sh = c.createLinearGradient(0, h, 0, h + 90); sh.addColorStop(0, `rgba(40,30,20,${.28 * (1 - k) + .05})`); sh.addColorStop(1, 'rgba(40,30,20,0)');
  c.fillStyle = sh; c.fillRect(0, h, W, 90); c.restore();
  if (h < 2) return;
  c.drawImage(src, 0, 0, src.width, src.height, 0, 0, W, h);
  const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, 'rgba(30,25,20,0)'); g.addColorStop(1, `rgba(30,25,20,${(1 - k) * .45})`);
  c.fillStyle = g; c.fillRect(0, 0, W, h);
  c.fillStyle = `rgba(255,250,235,${(1 - k) * .35})`; c.fillRect(0, h - 3, W, 3);
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = (now - last) / 1000; if (dt < 1 / 24 - .004) return; last = now;
  if (!paused) clock += Math.min(dt, .1);
  if (!paperL) return;
  const p = page(curSlide);
  if (flip) {
    const u = clamp((clock - flip.t0) / FLIP, 0, 1), e = easeInOutSine(u);
    if (flip.dir > 0) { compose(pageCtx, p); drawFlip(pageCtx, snap, Math.cos(e * Math.PI / 2), 1); }
    else { blitC(pageCtx, snap); compose(buf.getContext('2d'), p); drawFlip(pageCtx, buf, Math.sin(e * Math.PI / 2), -1); }
    if (u >= 1) flip = null;
  } else compose(pageCtx, p);
  // En el tiempo que sobra, la lámina siguiente prepara sus acuarelas y sombreados.
  if (!flip && p.done && curSlide + 1 < SLIDES.length) prewarm(page(curSlide + 1).sheet, 6);
}

function go(i, instant) {
  i = clamp(i, 0, SLIDES.length - 1); if (i === curSlide && !instant) return;
  const dir = i > curSlide ? 1 : -1;
  if (!instant && !REDUCED) { snap.getContext('2d').drawImage(pageCv, 0, 0); flip = { dir, t0: clock }; }
  curSlide = i; evictPages();
  const p = page(i);
  if (p.done) p.start = clock - REVEAL_MAX - 6;
  else if (dir < 0 || REDUCED) p.start = -1e3;
  else p.start = clock + (instant ? 0 : FLIP * .55);
  history.replaceState(null, '', '#' + (i + 1));
  syncUi();
}

// ---------- tamaño y nitidez ----------
function fit() {
  const vw = innerWidth, vh = innerHeight, k = Math.min(vw / 1920, vh / 1080), dpr = Math.min(devicePixelRatio || 1, 2);
  stage.style.width = 1920 * k + 'px'; stage.style.height = 1080 * k + 'px';
  setFormat({ ar: '16:9', width: Math.min(2880, Math.round(1920 * k * dpr)) });
  pageCv.width = OUT_W; pageCv.height = OUT_H;
  paperL = paperLayer(); snap = makeCanvas(); buf = makeCanvas(); clearSprites();
  for (const p of pages.values()) { p.bake = null; for (const m of p.sheet.marks) m.spr = null; if (p.done) p.start = clock - REVEAL_MAX; }
}

// ---------- controles ----------
const $ = s => document.querySelector(s);
const live = $('#live'), counter = $('#count');
function syncUi() {
  const sl = SLIDES[curSlide];
  counter.textContent = `${curSlide + 1} / ${SLIDES.length}`;
  live.textContent = `${sl.title}${sl.subtitle ? '. ' + sl.subtitle : ''}. ${ACTS[sl.act]}. Diapositiva ${curSlide + 1} de ${SLIDES.length}.`;
  $('#prev').disabled = curSlide === 0; $('#next').disabled = curSlide === SLIDES.length - 1;
}
function togglePause() { paused = !paused; $('#pause').setAttribute('aria-pressed', paused); $('#pause').title = paused ? 'Reanudar (P)' : 'Pausar (P)'; }
function fullscreen() { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); }
addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const k = e.key;
  if (k === 'ArrowRight' || k === 'PageDown' || k === ' ' || k === 'Enter') { e.preventDefault(); go(curSlide + 1); }
  else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { e.preventDefault(); go(curSlide - 1); }
  else if (k === 'Home') go(0); else if (k === 'End') go(SLIDES.length - 1);
  else if (k === 'f' || k === 'F') fullscreen(); else if (k === 'p' || k === 'P') togglePause();
});
$('#prev').onclick = () => go(curSlide - 1); $('#next').onclick = () => go(curSlide + 1);
$('#pause').onclick = togglePause; $('#full').onclick = fullscreen;
pageCv.addEventListener('click', e => { const r = pageCv.getBoundingClientRect(); go(curSlide + (e.clientX - r.left < r.width * .25 ? -1 : 1)); });
let tx = null; pageCv.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
pageCv.addEventListener('touchend', e => { if (tx == null) return; const d = e.changedTouches[0].clientX - tx; if (Math.abs(d) > 50) go(curSlide + (d < 0 ? 1 : -1)); tx = null; });
let wheelLock = 0; addEventListener('wheel', e => { const n = performance.now(); if (n < wheelLock || Math.abs(e.deltaY) < 20) return; wheelLock = n + 700; go(curSlide + Math.sign(e.deltaY)); }, { passive: true });
let idle; addEventListener('pointermove', () => { document.body.classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => document.body.classList.add('idle'), 2600); });
addEventListener('hashchange', () => { const n = parseInt(location.hash.slice(1), 10); if (n && n - 1 !== curSlide) go(n - 1); });
addEventListener('resize', () => { clearTimeout(fit.t); fit.t = setTimeout(fit, 120); });

(async () => {
  try { await Promise.race([Promise.all([document.fonts.load(`500 100px ${SERIF}`), document.fonts.load(`italic 500 40px ${SERIF}`), document.fonts.load(`500 20px ${SANS}`), document.fonts.load(`600 20px ${SANS}`), preloadPhotos()]), new Promise(r => setTimeout(r, 2500))]); } catch { }
  fit();
  const n = parseInt(location.hash.slice(1), 10);
  curSlide = n >= 1 && n <= SLIDES.length ? n - 1 : 0;
  go(curSlide, true);
  document.body.classList.add('ready');
  requestAnimationFrame(frame);
})();
// Para inspección desde la consola.
window.__deck = {
  frame, go, get clock() { return clock; }, get cur() { return curSlide; }, get fmt() { return { W, H, S, OUT_W, OUT_H, cw: pageCv.width }; },
  // Dibuja la lámina i terminada (t = segundos de animación) sin esperar al bucle.
  still(i, t = 6) { flip = null; curSlide = i; const p = page(i); p.start = clock - t; compose(pageCtx, p); syncUi(); return { marks: p.sheet.marks.length, end: +p.sheet.end().toFixed(2) }; },
  time(i) { const p = page(i), g = makeCanvas().getContext('2d'), t = performance.now(); p.start = clock - 10; p.bake = null; page(i); compose(g, p); const a = performance.now() - t, t2 = performance.now(); compose(g, p); return { first: Math.round(a), next: Math.round(performance.now() - t2) }; },
};

}</script>
